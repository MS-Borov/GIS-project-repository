
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: gis_platform_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gis_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gis_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: gis_platform_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
        - redis_data:/data
      
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  minio:
    image: minio/minio:latest
    container_name: gis-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"

    environment:
       MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
       MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

    ports:
       - "127.0.0.1:${MINIO_PORT:-9000}:9000"
       - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
        
    volumes:
      - minio_data:/data
        
    healthcheck:
       test: ["CMD", "mc", "ready", "local"]
       interval: 10s
       timeout: 5s
       retries: 5
        
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gis-backend-dev
    restart: unless-stopped

    env_file:
      - .env
    
    # Нужно, чтобы контейнер видел Ollama, запущенный на хосте.
    # Для Linux/WSL это обычно самый простой путь.
    extra_hosts:
      - "host.docker.internal:host-gateway"
          
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
          
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
            
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: gis-worker-dev
    restart: unless-stopped
    env_file:
      - .env

    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    command: >
      sh -c "taskiq worker app.tasks.broker:broker"

  ai-digitizer:
    build:
      context: ./ai-digitizer-service
      dockerfile: ${AI_DIGITIZER_DOCKERFILE:-Dockerfile}
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu121}
    container_name: gis-ai-digitizer-dev
    restart: unless-stopped
    gpus: all
    environment:
      AI_DIGITIZER_BACKEND: ${AI_DIGITIZER_BACKEND:-classical-cv}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      SAM2_REPO_PATH: ${SAM2_REPO_PATH:-/opt/sam2}
      SAM2_MODEL_CFG: ${SAM2_MODEL_CFG:-configs/sam2.1/sam2.1_hiera_t.yaml}
      SAM2_CHECKPOINT: ${SAM2_CHECKPOINT:-/models/sam2.1_hiera_tiny.pt}
      SAM2_DEVICE: ${SAM2_DEVICE:-auto}
      SAM2_MASK_PROMPT_SIZE: ${SAM2_MASK_PROMPT_SIZE:-256}
      PROMPT_ML_BUFFER_RATIO: ${PROMPT_ML_BUFFER_RATIO:-0.08}
      PROMPT_ML_BUFFER_MAX_PX: ${PROMPT_ML_BUFFER_MAX_PX:-90}
      PROMPT_ML_NEGATIVE_RING_RATIO: ${PROMPT_ML_NEGATIVE_RING_RATIO:-0.22}
      PROMPT_ML_MAX_SAMPLES: ${PROMPT_ML_MAX_SAMPLES:-6000}
      PROMPT_ML_POSITIVE_THRESHOLD_SCALE: ${PROMPT_ML_POSITIVE_THRESHOLD_SCALE:-1.45}
      PROMPT_ML_NEGATIVE_MARGIN: ${PROMPT_ML_NEGATIVE_MARGIN:-0.72}
      PROMPT_ML_MAX_AREA_RATIO: ${PROMPT_ML_MAX_AREA_RATIO:-0.82}
      PROMPT_ML_SIMPLIFY_RATIO: ${PROMPT_ML_SIMPLIFY_RATIO:-0.0045}
      SAM2_MAX_COARSE_AREA_RATIO: ${SAM2_MAX_COARSE_AREA_RATIO:-1.25}
      SAM2_MIN_COARSE_IOU: ${SAM2_MIN_COARSE_IOU:-0.55}
      SAM2_MIN_COARSE_COVERAGE: ${SAM2_MIN_COARSE_COVERAGE:-0.72}
      WATER_UNET_CHECKPOINT: ${WATER_UNET_CHECKPOINT:-/models/water_unet.pt}
      WATER_UNET_DEVICE: ${WATER_UNET_DEVICE:-auto}
      WATER_UNET_THRESHOLD: ${WATER_UNET_THRESHOLD:-0.5}
      AI_PROMPT_BUFFER_RATIO: ${AI_PROMPT_BUFFER_RATIO:-0.04}
      AI_PROMPT_BUFFER_MAX_PX: ${AI_PROMPT_BUFFER_MAX_PX:-40}
      AI_MIN_RESULT_PROMPT_IOU: ${AI_MIN_RESULT_PROMPT_IOU:-0.28}
      AI_MIN_PROMPT_COVERAGE: ${AI_MIN_PROMPT_COVERAGE:-0.55}
      AI_MAX_RESULT_PROMPT_AREA_RATIO: ${AI_MAX_RESULT_PROMPT_AREA_RATIO:-1.8}
    ports:
      - "127.0.0.1:${AI_DIGITIZER_PORT:-8790}:8790"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8790", "--reload"]
    volumes:
      - ./ai-digitizer-service:/app
      - ./tools:/tools:ro
      - ${AI_MODELS_DIR:-./models}:/models
      - ${AI_DATASETS_DIR:-./datasets}:/datasets
      - ${AI_EXPERIMENTS_DIR:-./experiments}:/experiments
      - ${SAM2_REPO_PATH_HOST:-./ai-digitizer-service/vendor/sam2}:/opt/sam2:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gis-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host"]

  nginx:
    image: nginx:1.27-alpine
    container_name: gis-nginx-dev
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro


volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_uploads:




      
